<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A型就労支援システム</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans JP', sans-serif;
  background: linear-gradient(135deg, #5c6bc0 0%, #7e57c2 100%);
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 32px 20px;
}
h1 { color: white; font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; text-align: center; }
.sub { color: rgba(255,255,255,0.75); font-size: 0.85rem; margin-bottom: 36px; text-align: center; }
.cards { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 360px; }
.card {
  background: white; border-radius: 18px;
  text-decoration: none; color: #2c3e50;
  box-shadow: 0 6px 24px rgba(0,0,0,0.15);
  transition: transform 0.15s, box-shadow 0.15s;
  display: block; overflow: hidden;
}
.card:active { transform: scale(0.97); }
.card-inner { display: flex; align-items: center; gap: 18px; padding: 20px 22px; }
.icon {
  width: 56px; height: 56px; border-radius: 14px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 1.7rem;
}
.ic-purple { background: linear-gradient(135deg, #5c6bc0, #7e57c2); }
.ic-green  { background: linear-gradient(135deg, #2e7d32, #43a047); }
.ic-blue   { background: linear-gradient(135deg, #1565c0, #1976d2); }
.card-text h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 3px; }
.card-text p  { font-size: 0.78rem; color: #888; line-height: 1.4; }
</style>
</head>
<body>
<h1>🏢 A型就労支援システム</h1>
<p class="sub">ご利用のメニューを選んでください</p>
<div class="cards">
  <a href="manager.html" class="card">
    <div class="card-inner">
      <div class="icon ic-purple">📋</div>
      <div class="card-text">
        <h2>管理者メニュー</h2>
        <p>指導員・シフト・給与・勤怠管理</p>
      </div>
    </div>
  </a>
  <a href="user.html" class="card">
    <div class="card-inner">
      <div class="icon ic-green">👤</div>
      <div class="card-text">
        <h2>利用者メニュー</h2>
        <p>タイムカード・日報の入力</p>
      </div>
    </div>
  </a>
  <a href="timecard.html" class="card">
    <div class="card-inner">
      <div class="icon ic-blue">🕐</div>
      <div class="card-text">
        <h2>タイムカード打刻</h2>
        <p>共有タブレットからの出退勤打刻</p>
      </div>
    </div>
  </a>
</div>
</body>
</html>
